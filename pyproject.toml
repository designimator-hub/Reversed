[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reversed-core"
version = "0.1.0"
description = "Voxel topology optimization solver core (CPU reference path)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
mesh = ["scikit-image>=0.21"]
gpu = ["warp-lang>=1.5"]
dev = [
  "pytest>=7", "ruff>=0.5", "mypy>=1.8", "scikit-image>=0.21", "pymoto>=2.0", "warp-lang>=1.5",
]

[project.scripts]
reversed-solve = "reversed_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer optimization runs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
